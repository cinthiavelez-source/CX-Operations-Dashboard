<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CX Performance Reviews</title>
<style>
:root{--bg:#f6f5f2;--paper:#fff;--ink:#252522;--muted:#676d69;--line:#e1e4df;--accent:#df7926;--accent-soft:#fff0e1;--good:#287b55;--good-soft:#e7f5eb;--warn:#a46119;--warn-soft:#fff2df;--bad:#ad3f36;--bad-soft:#fff0ed;--shadow:0 5px 28px #20271d0a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.48 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #eaa96e;outline-offset:2px}
.appbar{height:62px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;gap:16px}.brand{font-size:18px;font-weight:750;letter-spacing:-.03em}.brand em{font-style:normal;color:var(--accent)}.userline{color:var(--muted);font-size:12px;text-align:right}.shell{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:calc(100vh - 62px)}.sidebar{background:var(--paper);border-right:1px solid var(--line);padding:24px 12px}.sidebar small{display:block;text-transform:uppercase;color:var(--muted);letter-spacing:.09em;font-size:11px;font-weight:700;padding:0 12px 10px}.nav{display:grid;gap:4px}.nav button{border:0;border-radius:9px;text-align:left;padding:11px 12px;background:transparent;color:var(--muted);font-weight:600}.nav button.active{background:var(--accent-soft);color:#96521a}.main{padding:28px;max-width:1450px;width:100%;margin:0 auto}.page{display:none}.page.active{display:block}.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:22px;flex-wrap:wrap}.eyebrow{text-transform:uppercase;letter-spacing:.09em;color:var(--accent);font-size:11px;font-weight:800;margin-bottom:5px}h1{font-size:27px;letter-spacing:-.035em;line-height:1.2;margin:0 0 5px}h2{font-size:18px;letter-spacing:-.02em;margin:0 0 12px}h3{font-size:14px;margin:0 0 5px}p{margin:0;color:var(--muted)}.small{font-size:12px}.muted{color:var(--muted)}.strong{font-weight:700}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;background:var(--accent-soft);color:#96521a;font-size:11px;font-weight:700;white-space:nowrap}.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.card{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:19px;box-shadow:var(--shadow)}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:20px}.metric label{display:block;color:var(--muted);font-size:12px}.metric strong{display:block;font-size:28px;letter-spacing:-.03em;margin:5px 0 2px}.metric span{font-size:12px;color:var(--muted)}.columns{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(260px,.8fr);gap:16px}.stack{display:grid;gap:16px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.spread{justify-content:space-between}.gap-top{margin-top:16px}.gap-bottom{margin-bottom:16px}.field{display:grid;gap:5px;min-width:150px}.field label{font-size:12px;font-weight:700;color:var(--muted)}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);padding:9px 10px;min-height:38px}.field textarea{min-height:100px;resize:vertical}.field input[type=file]{max-width:100%;padding:7px}.btn{border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);padding:9px 13px;font-weight:700}.btn:hover:not(:disabled){border-color:var(--accent)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.ghost{border:0;background:transparent;color:var(--accent)}.btn.danger{color:var(--bad)}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px;min-width:590px}th{text-align:left;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line);padding:10px 8px}td{border-bottom:1px solid var(--line);padding:11px 8px;vertical-align:top}tr:last-child td{border-bottom:0}.num{text-align:right;font-variant-numeric:tabular-nums}.linkbutton{border:0;background:none;color:var(--accent);padding:0;text-align:left;font-weight:700}.detail{display:block;font-size:11px;color:var(--muted);margin-top:2px}.empty{padding:26px;text-align:center;color:var(--muted);background:var(--paper);border:1px dashed var(--line);border-radius:11px}.banner{border-radius:10px;padding:10px 13px;margin-bottom:14px;background:var(--accent-soft);color:#794711;font-size:12px}.banner.warn{background:var(--warn-soft);color:#815115}.banner.bad{background:var(--bad-soft);color:var(--bad)}.banner.good{background:var(--good-soft);color:var(--good)}.selectorbar{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin-bottom:16px}.score-summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.score-summary div{background:var(--bg);border-radius:8px;padding:10px}.score-summary small{display:block;color:var(--muted)}.score-summary strong{font-size:23px;font-variant-numeric:tabular-nums}.kpirow{display:grid;grid-template-columns:minmax(65px,1fr) repeat(4,minmax(55px,70px));gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}.kpirow:last-child{border-bottom:0}.kpirow.header{color:var(--muted);font-size:11px}.kpirow .num{font-variant-numeric:tabular-nums}.criterion{border-bottom:1px solid var(--line);padding:16px 0}.criterion:last-child{border-bottom:0}.criterion-top{display:flex;justify-content:space-between;gap:16px}.criterion h3{margin:0 0 3px}.criterion .field{min-width:80px}.criterion .field select{width:90px}.criterion p{font-size:12px}.criterion details{margin-top:8px;color:var(--muted);font-size:12px}.criterion summary{cursor:pointer;color:var(--accent);font-weight:700}.criterion details p{margin-top:6px;white-space:pre-wrap}.rating-guide{font-size:11px;color:var(--muted);margin-top:8px}.history-row{display:grid;grid-template-columns:75px 1fr 1fr;gap:8px;border-bottom:1px solid var(--line);padding:10px 0;font-size:12px}.history-row:last-child{border-bottom:0}.history-row.header{color:var(--muted)}.importbox{border:1px dashed var(--line);border-radius:10px;padding:16px;margin-top:14px}.preview-table{max-height:220px;overflow:auto}.notice{color:var(--bad);font-size:12px;margin-top:8px}.success{color:var(--good)}.loading{min-height:180px;display:grid;place-items:center;color:var(--muted)}#toast{position:fixed;bottom:18px;right:18px;max-width:360px;background:var(--ink);color:#fff;border-radius:9px;padding:12px 15px;box-shadow:var(--shadow);display:none;z-index:10}#toast.show{display:block}
@media(max-width:850px){.shell{grid-template-columns:1fr}.sidebar{border-right:0;border-bottom:1px solid var(--line);padding:8px 12px}.sidebar small{display:none}.nav{display:flex;flex-wrap:wrap}.main{padding:20px}.columns{grid-template-columns:1fr}}
@media(max-width:580px){.appbar{padding:0 15px}.main{padding:14px}.cards{grid-template-columns:1fr}.score-summary{grid-template-columns:1fr 1fr}.criterion-top{gap:9px}.kpirow{grid-template-columns:minmax(48px,1fr) repeat(4,minmax(38px,54px));gap:4px;font-size:11px}}
</style>
</head>
<body>
<header class="appbar"><div class="brand">CookUnity <em>CX</em> Reviews</div><div class="userline" id="userline">Loading secure workspace…</div></header>
<div class="shell"><aside class="sidebar"><small>Workspace</small><nav class="nav" aria-label="Pages"><button class="active" data-page="overview" type="button">Overview</button><button data-page="review" type="button">Agent review</button><button data-page="imports" type="button" hidden>Imports</button><button data-page="access" type="button" hidden>Access</button></nav></aside><main class="main">
<section class="page active" id="page-overview"><div class="loading">Loading reviews…</div></section>
<section class="page" id="page-review"></section>
<section class="page" id="page-imports"></section>
<section class="page" id="page-access"></section>
</main></div><div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const DEMO = !(window.google && google.script && google.script.run);
const demoFramework = [
  {id:'row-11',role:'Associate',name:'Case Handling & Judgment (Competency)',type:'Competency',description:'How independently the person handles cases.',expectation:'Follows macros and SOPs and escalates ambiguity or situations outside policy.',behavior:'Asks whether a decision is within their authority before acting.'},
  {id:'row-13',role:'Associate',name:'Communication & Escalation Management (Competency)',type:'Competency',description:'How clearly decisions are escalated.',expectation:'Explains what happened, what was checked, and what decision is needed.',behavior:'Includes the ticket number and the specific decision requested.'},
  {id:'row-17',role:'Associate',name:'Data & KPI Analysis (Skill)',type:'Skill',description:'Ability to understand performance data.',expectation:'Knows their metrics and identifies where performance differs from target.',behavior:'Identifies the KPI and how far it is from target.'},
  {id:'row-21',role:'Associate',name:'Technical & Tool Proficiency (Skill)',type:'Skill',description:'Comfort with tools.',expectation:'Uses Zendesk fields, contact reasons, and approved macros correctly.',behavior:'Selects the correct reason and completes required fields.'}
];
const demoKpi = {id:'2026-H1|jordan.reyes@cookunity.com',period:'2026-H1',email:'jordan.reyes@cookunity.com',tph:4.2,csat:.79,iqs:.88,tphAttainment:4.2/4.5,csatAttainment:.79/.8,iqsAttainment:.88/.85,weightedAttainment:.979,rawRating:4,finalRating:4,capReason:''};
let cachedData = {user:{email:'demo.admin@cookunity.com',role:'admin'},roster:[{email:'jordan.reyes@cookunity.com',name:'Jordan Reyes',role:'Associate',supervisorEmail:'maya.chen@cookunity.com',active:true}],kpis:[demoKpi],reviews:[],framework:demoFramework,targets:{tph:4.5,csat:.8,iqs:.85},weights:{tph:.375,csat:.375,iqs:.25},users:[{email:'demo.admin@cookunity.com',role:'admin',active:true},{email:'maya.chen@cookunity.com',role:'supervisor',active:true}]};
let currentPage='overview', selectedAgent='', selectedPeriod='2026-H1', draftScores={}, draftNote='', rosterPreview=null, kpiPreview=null, kpiPeriod='2026-H1', accessSavePending=false;
const $ = id => document.getElementById(id);
const esc = value => String(value ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtPct = n => Number.isFinite(Number(n)) ? (Number(n)*100).toFixed(1)+'%' : '—';
const fmtScore = n => n === '' || n === null || n === undefined ? '—' : Number(n).toFixed(1);
const periodSort = (a,b) => String(b).localeCompare(String(a));
function toast(message){const el=$('toast');el.textContent=message;el.classList.add('show');clearTimeout(el._timer);el._timer=setTimeout(()=>el.classList.remove('show'),4500)}
function api(name,...args){return new Promise((resolve,reject)=>{if(DEMO)return reject(new Error('Preview mode: no data was saved.'));google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e.message||String(e))))[name](...args)})}
async function reload(){if(DEMO){$('userline').textContent='Preview · sample data';render();return}try{cachedData=await api('bootstrap');$('userline').textContent=cachedData.user.email+' · '+cachedData.user.role;render()}catch(err){$('page-overview').innerHTML='<div class="banner bad">'+esc(err.message)+'</div>';toast(err.message)}}
function navTo(page){currentPage=page;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.querySelectorAll('.page').forEach(s=>s.classList.toggle('active',s.id==='page-'+page));renderPage(page)}
function render(){const admin=cachedData.user.role==='admin';document.querySelectorAll('[data-page="imports"],[data-page="access"]').forEach(b=>b.hidden=!admin);if(!admin&&(currentPage==='imports'||currentPage==='access'))currentPage='overview';navTo(currentPage)}
function renderPage(page){if(page==='overview')renderOverview();if(page==='review')renderReview();if(page==='imports')renderImports();if(page==='access')renderAccess()}
function latestReviews(){return [...cachedData.reviews].sort((a,b)=>periodSort(a.period,b.period))}
function reviewFor(email,period){return cachedData.reviews.find(r=>r.agentEmail===email&&r.period===period)}
function kpiFor(email,period){return cachedData.kpis.find(k=>k.email===email&&k.period===period)}
function halfRollups(email){const submitted=cachedData.reviews.filter(r=>r.agentEmail===email&&r.status==='submitted');const years=[...new Set(submitted.map(r=>r.period.slice(0,4)))].sort().reverse();return years.flatMap(year=>[['H1','Q1','Q2'],['H2','Q3','Q4']].map(([half,q1,q2])=>{const a=submitted.find(r=>r.period===year+'-'+q1),b=submitted.find(r=>r.period===year+'-'+q2);if(!a||!b)return null;return {period:year+'-'+half,framework:(Number(a.frameworkAvg)+Number(b.frameworkAvg))/2,kpi:(Number(a.kpiSnapshot.finalRating)+Number(b.kpiSnapshot.finalRating))/2}}).filter(Boolean))}
function allPeriods(){return [...new Set([...cachedData.kpis.map(k=>k.period),...cachedData.reviews.map(r=>r.period),selectedPeriod])].sort(periodSort)}
function renderOverview(){const agents=cachedData.roster,submitted=cachedData.reviews.filter(r=>r.status==='submitted').length,drafts=cachedData.reviews.filter(r=>r.status==='draft').length;const rows=agents.map(a=>{const latest=latestReviews().find(r=>r.agentEmail===a.email);const kpi=latest?kpiFor(a.email,latest.period):cachedData.kpis.filter(k=>k.email===a.email).sort((x,y)=>periodSort(x.period,y.period))[0];return `<tr><td><button class="linkbutton" data-open-agent="${esc(a.email)}">${esc(a.name)}</button><span class="detail">${esc(a.email)}</span></td><td>${esc(a.role)}</td><td>${esc(latest?.period||kpi?.period||'—')}</td><td class="num">${kpi?esc(kpi.finalRating)+' / 6':'—'}</td><td class="num">${latest?fmtScore(latest.frameworkAvg)+' / 5':'—'}</td><td>${statusPill(latest?.status||'Not started')}</td></tr>`}).join('');$('page-overview').innerHTML=`<div class="pagehead"><div><div class="eyebrow">Cycle history</div><h1>Team reviews</h1><p>Quarterly reviews and half-year comparisons stay available across cycles.</p></div>${DEMO?'<span class="pill warn">Preview only · sample identities</span>':''}</div><div class="cards"><div class="card metric"><label>Assigned agents</label><strong>${agents.length}</strong><span>Associates and Specialists</span></div><div class="card metric"><label>Submitted reviews</label><strong>${submitted}</strong><span>Locked cycle records</span></div><div class="card metric"><label>Draft reviews</label><strong>${drafts}</strong><span>In progress</span></div></div><div class="columns"><div class="card"><div class="row spread gap-bottom"><h2 style="margin:0">Agents</h2><button class="btn primary" id="new-review" type="button">Open review</button></div>${agents.length?`<div class="tablewrap"><table><thead><tr><th>Agent</th><th>Role</th><th>Latest period</th><th class="num">KPI</th><th class="num">Framework</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div>`:'<div class="empty">No roster imported yet. An admin can import it under Imports.</div>'}</div><div class="card"><h2>How progression is kept</h2><p>Each submitted review is saved by agent and period. Select an agent to compare the KPI rating and framework average over time.</p><div class="banner gap-top">H1 is calculated from submitted Q1 and Q2 reviews; H2 from Q3 and Q4. A separate H1 or H2 KPI file remains labeled as that half-year and is not assigned to a quarter.</div><p class="small">The framework and KPI results used at submission are stored with that review.</p></div></div>`;document.querySelectorAll('[data-open-agent]').forEach(b=>b.addEventListener('click',()=>{selectedAgent=b.dataset.openAgent;selectedPeriod=latestReviews().find(r=>r.agentEmail===selectedAgent)?.period||cachedData.kpis.find(k=>k.email===selectedAgent)?.period||selectedPeriod;draftScores={};draftNote='';navTo('review')}));$('new-review').addEventListener('click',()=>navTo('review'))}
function statusPill(status){const cls=status==='submitted'?'good':status==='draft'?'warn':'';return `<span class="pill ${cls}">${esc(status)}</span>`}
function renderReview(){const agent=cachedData.roster.find(r=>r.email===selectedAgent)||cachedData.roster[0];if(!agent){$('page-review').innerHTML='<div class="empty">Import a roster before scoring reviews.</div>';return}selectedAgent=agent.email;const review=reviewFor(agent.email,selectedPeriod),kpi=kpiFor(agent.email,selectedPeriod),framework=review?.framework||cachedData.framework.filter(f=>f.role===agent.role);if(review&&Object.keys(draftScores).length===0){draftScores=Object.fromEntries(review.scores.map(s=>[s.id,s.score]));draftNote=review.justification||''}const readonly=review?.status==='submitted'||cachedData.user.role==='viewer';const scored=Object.values(draftScores).filter(x=>Number.isInteger(Number(x)));const avg=scored.length?scored.reduce((n,x)=>n+Number(x),0)/scored.length:null;const mustExplain=avg!==null&&scored.length===framework.length&&avg<4;const kpiBlock=kpi?`<div class="kpirow header"><span>KPI</span><span class="num">Actual</span><span class="num">Target</span><span class="num">Attain.</span><span class="num">Weight</span></div>${[['TPH','tph',1],['CSAT','csat',100],['IQS','iqs',100]].map(([label,key,m])=>`<div class="kpirow"><strong>${label}</strong><span class="num">${m===1?Number(kpi[key]).toFixed(1):fmtPct(kpi[key])}</span><span class="num">${m===1?'4.5':key==='csat'?'80%':'85%'}</span><span class="num">${fmtPct(kpi[key+'Attainment'])}</span><span class="num">${key==='iqs'?'25%':'37.5%'}</span></div>`).join('')}<p class="small gap-top">Weighted attainment <strong>${fmtPct(kpi.weightedAttainment)}</strong> · KPI rating <strong>${esc(kpi.finalRating)} / 6</strong>${kpi.capReason?` <span class="pill warn">Capped at 3: ${esc(kpi.capReason)}</span>`:''}</p>`:'<div class="banner warn">No KPI results have been imported for this agent and period. A draft can be saved, but submission requires KPI results.</div>';const criteria=framework.map(f=>`<div class="criterion"><div class="criterion-top"><div><h3>${esc(f.name)} <span class="muted">· ${esc(f.type)}</span></h3><p>${esc(f.description)}</p></div><div class="field"><label for="score-${esc(f.id)}">Score</label><select class="criterion-score" id="score-${esc(f.id)}" data-id="${esc(f.id)}" ${readonly?'disabled':''}><option value="">—</option>${[1,2,3,4,5].map(n=>`<option value="${n}" ${Number(draftScores[f.id])===n?'selected':''}>${n}</option>`).join('')}</select></div></div><details><summary>Expected at ${esc(agent.role)}</summary><p>${esc(f.expectation)}</p>${f.behavior?`<p><strong>Behavior example:</strong> ${esc(f.behavior)}</p>`:''}</details></div>`).join('');const history=cachedData.reviews.filter(r=>r.agentEmail===agent.email).sort((a,b)=>periodSort(a.period,b.period));const halves=halfRollups(agent.email);$('page-review').innerHTML=`<div class="pagehead"><div><div class="eyebrow">Agent review</div><h1>${esc(agent.name)}</h1><p>${esc(agent.role)} · Evaluator ${esc(agent.supervisorEmail)}</p></div>${statusPill(review?.status||'New')}</div><div class="selectorbar"><div class="field"><label for="agent-select">Agent</label><select id="agent-select">${cachedData.roster.map(a=>`<option value="${esc(a.email)}" ${a.email===agent.email?'selected':''}>${esc(a.name)} · ${esc(a.role)}</option>`).join('')}</select></div><div class="field"><label for="period-select">Review period</label><select id="period-select">${allPeriods().map(p=>`<option value="${esc(p)}" ${p===selectedPeriod?'selected':''}>${esc(p)}</option>`).join('')}</select></div><div class="field"><label for="period-new">Or enter a new period</label><input id="period-new" placeholder="2026-Q3 or 2026-H2" aria-label="New review period"></div><button class="btn" id="use-period" type="button">Use period</button></div><div class="columns"><div class="stack"><div class="card"><div class="row spread gap-bottom"><h2 style="margin:0">Competencies and skills</h2><span class="pill">${framework.length} criteria</span></div>${criteria||'<div class="empty">Framework criteria are unavailable.</div>'}</div><div class="card"><h2>Justification and coaching plan</h2><p id="justification-rule" class="small ${mustExplain?'notice':''}">${mustExplain?'Required: framework average is below 4.':'Required at submission if the framework average is below 4.'}</p><div class="field gap-top"><label for="justification">Supervisor note</label><textarea id="justification" ${readonly?'disabled':''} placeholder="What is behind the score? Include evidence and the next coaching step.">${esc(draftNote)}</textarea></div>${readonly?'<div class="banner good gap-top">This submitted review is locked. Its scores and KPI snapshot remain available in history.</div>':`<div class="row gap-top"><button class="btn" id="save-draft" type="button">Save draft</button><button class="btn primary" id="submit-review" type="button" ${!kpi||scored.length!==framework.length||(mustExplain&&!draftNote.trim())||DEMO?'disabled':''}>Submit review</button></div>`}</div></div><div class="stack"><div class="card"><h2>Results for ${esc(selectedPeriod)}</h2><div class="score-summary"><div><small>KPI rating</small><strong>${kpi?esc(kpi.finalRating)+' / 6':'—'}</strong></div><div><small>Framework average</small><strong id="average-display">${avg===null?'—':avg.toFixed(2)+' / 5'}</strong></div></div><div class="rating-guide">KPI 1–6 from weighted attainment. Any KPI more than 10% below target caps the overall KPI rating at 3.</div></div><div class="card"><h2>Quarterly KPI detail</h2>${kpiBlock}</div><div class="card"><h2>Cycle history</h2>${history.length?`<div class="history-row header"><span>Period</span><span>KPI</span><span>Framework</span></div>${history.map(r=>`<div class="history-row"><button class="linkbutton" data-history="${esc(r.period)}">${esc(r.period)}</button><span>${r.kpiSnapshot?esc(r.kpiSnapshot.finalRating)+'/6':'—'}</span><span>${fmtScore(r.frameworkAvg)}/5 · ${esc(r.status)}</span></div>`).join('')}`:'<p class="small">No earlier review yet.</p>'}<h3 class="gap-top">Half-year from quarters</h3>${halves.length?`<div class="history-row header"><span>Half</span><span>Avg KPI</span><span>Avg framework</span></div>${halves.map(h=>`<div class="history-row"><strong>${esc(h.period)}</strong><span>${h.kpi.toFixed(2)} / 6</span><span>${h.framework.toFixed(2)} / 5</span></div>`).join('')}`:'<p class="small">A half-year appears after both quarterly reviews are submitted.</p>'}</div></div></div>`;$('agent-select').addEventListener('change',e=>{selectedAgent=e.target.value;draftScores={};draftNote='';renderReview()});$('period-select').addEventListener('change',e=>{selectedPeriod=e.target.value;draftScores={};draftNote='';renderReview()});$('use-period').addEventListener('click',()=>{const p=$('period-new').value.trim().toUpperCase();if(!/^20\d{2}-(Q[1-4]|H[12])$/.test(p)){toast('Use YYYY-Q1…Q4 or YYYY-H1…H2.');return}selectedPeriod=p;draftScores={};draftNote='';renderReview()});document.querySelectorAll('.criterion-score').forEach(s=>s.addEventListener('change',()=>{if(s.value)draftScores[s.dataset.id]=Number(s.value);else delete draftScores[s.dataset.id];renderReview()}));$('justification').addEventListener('input',e=>{draftNote=e.target.value;const ready=Object.keys(draftScores).length===framework.length;const currentAvg=ready?Object.values(draftScores).reduce((n,x)=>n+Number(x),0)/framework.length:null;const button=$('submit-review');if(button)button.disabled=!kpi||!ready||(currentAvg<4&&!draftNote.trim())||DEMO});document.querySelectorAll('[data-history]').forEach(b=>b.addEventListener('click',()=>{selectedPeriod=b.dataset.history;draftScores={};draftNote='';renderReview()}));if(!readonly){$('save-draft').addEventListener('click',()=>save(false));$('submit-review').addEventListener('click',()=>save(true))}}
async function save(submit){try{const btn=submit?$('submit-review'):$('save-draft');btn.disabled=true;await api('saveReview',{agentEmail:selectedAgent,period:selectedPeriod,scores:Object.entries(draftScores).map(([id,score])=>({id,score})),justification:draftNote,submit});toast(submit?'Review submitted and locked.':'Draft saved.');draftScores={};draftNote='';await reload()}catch(err){toast(err.message);renderReview()}}
function parseCSV(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++}else quoted=false}else cell+=c}else if(c==='"')quoted=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell=''}else if(c!=='\r')cell+=c}if(quoted)throw Error('CSV has an unclosed quoted value.');if(cell!==''||row.length){row.push(cell);rows.push(row)}return rows.filter(r=>r.some(v=>v.trim()))}
function normalizeHeader(s){return String(s).trim().toLowerCase().replace(/[^a-z0-9]/g,'')}
function mapCSV(rows,kind){if(!rows.length)throw Error('CSV is empty.');const headers=rows[0].map(normalizeHeader);const pick=(names)=>{for(const n of names){const i=headers.indexOf(normalizeHeader(n));if(i>=0)return i}return -1};const spec=kind==='roster'?{name:['Full name','Name','Agent name'],email:['Work email','Email','Agent email'],role:['Role','Job title','Level'],supervisorEmail:['Supervisor email','Evaluator email','Manager email']}:{name:['Full name','Name'],email:['Work email','Email'],iqs:['IQS Actual'],tph:['TPH Actual'],csat:['CSAT Actual']};const indexes=Object.fromEntries(Object.entries(spec).map(([k,names])=>[k,pick(names)]));const required=kind==='roster'?['name','email','role','supervisorEmail']:['email','iqs','tph','csat'];const missing=required.filter(k=>indexes[k]<0);if(missing.length)throw Error('Missing columns: '+missing.join(', '));return rows.slice(1).map((row,i)=>{const record={_line:i+2};Object.keys(spec).forEach(k=>record[k]=indexes[k]<0?'':String(row[indexes[k]]||'').trim());return record})}
function downloadRosterTemplate(){const csv='Full name,Work email,Role,Supervisor email\nExample Agent,example.agent@cookunity.com,Associate,supervisor@cookunity.com\n';const url=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));const a=document.createElement('a');a.href=url;a.download='cx_roster_template.csv';a.click();URL.revokeObjectURL(url)}
function renderImports(){const admin=cachedData.user.role==='admin';if(!admin){$('page-imports').innerHTML='<div class="banner bad">Admin access required.</div>';return}$('page-imports').innerHTML=`<div class="pagehead"><div><div class="eyebrow">Administration</div><h1>Import data</h1><p>Review and match files before saving them to a period.</p></div>${DEMO?'<span class="pill warn">Preview only</span>':''}</div><div class="columns"><div class="stack"><div class="card"><h2>1 · Team roster</h2><p class="small">Required: Full name, Work email, Role, Supervisor email. Only Associate and Specialist agents are included.</p><div class="importbox"><div class="field"><label for="roster-file">Roster CSV</label><input id="roster-file" type="file" accept=".csv,text/csv"></div><button class="btn ghost gap-top" type="button" id="roster-template">Download roster template</button></div><div id="roster-preview"></div></div><div class="card"><h2>2 · KPI results</h2><p class="small">The supplied example has Full name, Work email, Manager, IQS Actual, TPH Actual, CSAT Actual. Matching uses Work email.</p><div class="importbox"><div class="row"><div class="field"><label for="kpi-period">Period for this file</label><input id="kpi-period" value="${esc(kpiPeriod)}" placeholder="2026-H1"></div><div class="field"><label for="kpi-file">KPI CSV</label><input id="kpi-file" type="file" accept=".csv,text/csv"></div></div></div><div id="kpi-preview"></div></div></div><div class="stack"><div class="card"><h2>Import rules</h2><p>TPH target 4.5, CSAT 80%, IQS 85%. Weights are 37.5%, 37.5%, and 25%. Scores follow the six attainment bands.</p><div class="banner gap-top">If any KPI is more than 10% below target, the overall KPI rating is capped at 3.</div><p class="small">KPI results cannot be replaced after reviews for the same period are submitted. This preserves the figures used for those reviews.</p></div><div class="card"><h2>Period identity</h2><p class="small">The example CSV has no period column. Select H1, H2, or a quarter before importing it. An H1 result is never copied into Q1 or Q2 automatically.</p></div></div></div>`;$('roster-template').addEventListener('click',downloadRosterTemplate);$('roster-file').addEventListener('change',async e=>{try{const f=e.target.files[0];if(!f)return;rosterPreview={file:f.name,records:mapCSV(parseCSV(await f.text()),'roster')};drawRosterPreview()}catch(err){$('roster-preview').innerHTML='<p class="notice">'+esc(err.message)+'</p>'}});$('kpi-file').addEventListener('change',async e=>{try{const f=e.target.files[0];if(!f)return;kpiPreview={file:f.name,records:mapCSV(parseCSV(await f.text()),'kpi')};drawKpiPreview()}catch(err){$('kpi-preview').innerHTML='<p class="notice">'+esc(err.message)+'</p>'}});$('kpi-period').addEventListener('input',e=>kpiPeriod=e.target.value.trim().toUpperCase());if(rosterPreview)drawRosterPreview();if(kpiPreview)drawKpiPreview()}
function drawRosterPreview(){const r=rosterPreview.records,errors=r.filter(x=>!x.name||!x.email||!['Associate','Specialist'].includes(x.role)||!x.supervisorEmail);$('roster-preview').innerHTML=`<div class="gap-top"><strong>${r.length} roster rows</strong> <span class="small muted">· ${esc(rosterPreview.file)}</span></div>${errors.length?`<p class="notice">${errors.length} row(s) need a name, CookUnity email, Associate/Specialist role, or supervisor email.</p>`:''}<div class="preview-table tablewrap"><table><thead><tr><th>Name</th><th>Work email</th><th>Role</th><th>Evaluator email</th></tr></thead><tbody>${r.slice(0,8).map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.email)}</td><td>${esc(x.role)}</td><td>${esc(x.supervisorEmail)}</td></tr>`).join('')}</tbody></table></div><button class="btn primary gap-top" id="confirm-roster" type="button" ${errors.length||DEMO?'disabled':''}>Import roster</button>`;$('confirm-roster').addEventListener('click',async()=>{try{await api('importRoster',r.map(({_line,...x})=>x));rosterPreview=null;toast('Roster imported.');await reload()}catch(err){toast(err.message)}})}
function drawKpiPreview(){const r=kpiPreview.records,missing=r.filter(x=>!x.email||x.iqs===''||x.tph===''||x.csat==='');$('kpi-preview').innerHTML=`<div class="gap-top"><strong>${r.length} KPI rows</strong> <span class="small muted">· ${esc(kpiPreview.file)}</span></div>${missing.length?`<p class="notice">${missing.length} row(s) have a missing email or KPI value.</p>`:''}<div class="preview-table tablewrap"><table><thead><tr><th>Name</th><th>Work email</th><th class="num">IQS</th><th class="num">TPH</th><th class="num">CSAT</th></tr></thead><tbody>${r.slice(0,8).map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.email)}</td><td class="num">${esc(x.iqs)}</td><td class="num">${esc(x.tph)}</td><td class="num">${esc(x.csat)}</td></tr>`).join('')}</tbody></table></div><button class="btn primary gap-top" id="confirm-kpis" type="button" ${missing.length||DEMO?'disabled':''}>Import KPI results</button>`;$('confirm-kpis').addEventListener('click',async()=>{const p=$('kpi-period').value.trim().toUpperCase();if(!/^20\d{2}-(Q[1-4]|H[12])$/.test(p)){toast('Choose a valid period such as 2026-H1 or 2026-Q2.');return}try{await api('importKpis',p,r.map(({_line,name,...x})=>x),kpiPreview.file);kpiPreview=null;kpiPeriod=p;toast('KPI results imported.');await reload()}catch(err){toast(err.message)}})}
function renderAccess(){if(cachedData.user.role!=='admin'){$('page-access').innerHTML='<div class="banner bad">Admin access required.</div>';return}const users=cachedData.users||[];$('page-access').innerHTML=`<div class="pagehead"><div><div class="eyebrow">Administration</div><h1>Access</h1><p>Only people listed here can open reviews. Supervisors see assigned agents and can score. Leadership can view all reviews without scoring. Add each person explicitly, even if they appear in the roster.</p></div></div><div class="card"><h2>Authorized users</h2><div class="tablewrap"><table><thead><tr><th>Email</th><th>Role</th><th>Status</th></tr></thead><tbody>${users.map(u=>`<tr><td>${esc(u.email)}</td><td>${esc(u.role==='viewer'?'Leadership · read-only':u.role)}</td><td>${u.active?'Active':'Disabled'}</td></tr>`).join('')}</tbody></table></div></div><div class="card gap-top"><h2>Set role</h2><div class="row"><div class="field"><label for="access-email">CookUnity email</label><input id="access-email" type="email" placeholder="person@cookunity.com"></div><div class="field"><label for="access-role">Role</label><select id="access-role"><option value="supervisor">Supervisor</option><option value="viewer">Leadership · read-only</option><option value="disabled">Disabled</option></select></div><button class="btn primary" id="access-save" type="button" ${DEMO||accessSavePending?'disabled':''}>${accessSavePending?'Saving…':'Save access'}</button></div></div>`;$('access-save').addEventListener('click',saveAccess)}
async function saveAccess(){
  if(accessSavePending)return;
  const email=$('access-email').value.trim(), role=$('access-role').value;
  const button=$('access-save');
  accessSavePending=true;
  button.disabled=true;
  button.textContent='Saving…';
  button.setAttribute('aria-busy','true');
  try{
    const saved=await api('updateUserRole',email,role);
    cachedData.users=(cachedData.users||[]).filter(u=>String(u.email).trim().toLowerCase()!==saved.email);
    cachedData.users.push({email:saved.email,role:saved.role,active:saved.role!=='disabled'});
    renderAccess();
    toast('Access saved.');
  }catch(err){toast(err.message)}
  finally{
    accessSavePending=false;
    const current=$('access-save');
    if(current){current.disabled=DEMO;current.textContent='Save access';current.removeAttribute('aria-busy')}
  }
}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>navTo(b.dataset.page)));
reload();
</script>
